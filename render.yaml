services:
  - type: web
    name: suraksha-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: suraksha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DOCUMENT_MASTER_KEY
        generateValue: true

databases:
  - name: suraksha-db
    databaseName: suraksha
    user: suraksha
    plan: free
