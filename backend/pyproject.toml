[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suraksha-backend"
version = "1.0.0"
description = "SURAKSHA SIH26265 Security Deposit / FDR Control Tower — Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "sqlalchemy>=2.0.20",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "passlib[argon2]>=1.7.4",
    "APScheduler>=3.9.0",
    "pgcrypto>=1.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
]

[tool.pytest]
testpaths = ["tests"]
python_functions = ["test_"]

[tool.black]
line-length = 88
target-version = ["Python 3.12"]

[tool.isort]
profile = "black"